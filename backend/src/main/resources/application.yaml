
spring:
  application:
    name: tempus-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/tempus_db
    username: postgres
    password: ${DB_Password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
